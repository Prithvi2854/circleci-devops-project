version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

      - run:
          name: Run automated tests
          command: |
            python -m pytest

      - run:
          name: Code quality check
          command: |
            python -m flake8 app tests

workflows:
  build-and-test:
    jobs:
      - test